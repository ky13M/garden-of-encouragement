<!DOCTYPE html>
<html lang="en"
<head>
    <meta charset="UTF-8">
    <meta name="viewport"content="width=device-width, intial-scale=1.0">
    <title>A Garden of Encouragement</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="stars" id="stars"></div>
    <div class="particles" id="particles"></div>

    <main class="welcome-screen" id="welcomeScreen">

        <div class="glow"></div>

        <div class="flower-bouquet">
          <div class="rose rose-one">🌻</div>
          <div class="rose rose-two">🌻</div>
          <div class="rose rose-three">🌻</div>
          <div class="rose rose-four">🌻</div>
          <div class="rose rose-five">🌻</div>  
        </div>

        <p class="small-heading">A LITTLE GIFT FOR YOU</p>

        <h1>A Garden of<br>
            <span>Encouragement</span>
        </h1>

        <p class="welcome-message">
            A little reminder that you are loved,
            appreciated, and never walking alone.
        </p>

        <button id="beginButton">
            Enter Your Garden <span>✿</span>
        </button>

        <p class="footer-message">
            Made with love, just for you ♡
        </p>

    </main>

    <script src="script.js"></script>
</body>
</html>
